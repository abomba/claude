[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qcdb"
version = "0.1.0"
description = "PostgreSQL database and loader for per-sample bacterial WGS QC results"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "types-jsonschema"]

[project.scripts]
qcdb = "qcdb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qcdb = ["data/*", "migrations/script.py.mako", "migrations/alembic.ini", "migrations/versions/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "C4", "PT"]
ignore = ["S101", "S608", "RUF001", "RUF002", "RUF003", "PT018"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["psycopg.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
